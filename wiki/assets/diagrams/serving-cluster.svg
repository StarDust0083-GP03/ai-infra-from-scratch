<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="流量选择与容量准备是两条链"><title>流量选择与容量准备是两条链</title><rect width="960" height="470" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">流量选择与容量准备是两条链</text><rect x="30" y="105" width="175" height="90" fill="#e7eef0" stroke="#bfc8cc"/><text x="44" y="134" font-size="19" fill="#202b32" text-anchor="start">接入与边界</text><text x="44" y="160" font-size="15" fill="#56616b" text-anchor="start">模型、租户、长度</text><path d="M205 150 L255 150" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="255.0,150.0 245.8,153.9 245.8,146.1" fill="#245d79"/><rect x="260" y="85" width="230" height="70" fill="#e7eef0" stroke="#bfc8cc"/><text x="274" y="114" font-size="19" fill="#202b32" text-anchor="start">模型 A 就绪组</text><text x="274" y="140" font-size="15" fill="#56616b" text-anchor="start">新请求只到 Ready</text><rect x="260" y="190" width="230" height="70" fill="#e7eef0" stroke="#bfc8cc"/><text x="274" y="219" font-size="19" fill="#202b32" text-anchor="start">模型 B 就绪组</text><text x="274" y="245" font-size="15" fill="#56616b" text-anchor="start">独立容量合同</text><rect x="620" y="85" width="290" height="70" fill="#e7eef0" stroke="#bfc8cc"/><text x="634" y="114" font-size="19" fill="#202b32" text-anchor="start">旧版本排空组</text><text x="634" y="140" font-size="15" fill="#56616b" text-anchor="start">不接新工作，处理已有流</text><path d="M490 120 L615 120" stroke="#56616b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="520" y="185" font-size="16" fill="#56616b" text-anchor="start">版本切换</text><rect x="60" y="315" width="260" height="65" fill="#e7eef0" stroke="#bfc8cc"/><text x="74" y="344" font-size="19" fill="#202b32" text-anchor="start">下载</text><text x="74" y="370" font-size="15" fill="#56616b" text-anchor="start">限制同时准备数</text><path d="M320 347 L355 347" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="355.0,347.0 345.8,350.9 345.8,343.1" fill="#245d79"/><rect x="360" y="315" width="260" height="65" fill="#e7eef0" stroke="#bfc8cc"/><text x="374" y="344" font-size="19" fill="#202b32" text-anchor="start">加载 / 预热</text><text x="374" y="370" font-size="15" fill="#56616b" text-anchor="start">端口开放还不够</text><path d="M620 347 L655 347" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="655.0,347.0 645.8,350.9 645.8,343.1" fill="#245d79"/><rect x="660" y="315" width="260" height="65" fill="#e7eef0" stroke="#bfc8cc"/><text x="674" y="344" font-size="19" fill="#202b32" text-anchor="start">就绪</text><text x="674" y="370" font-size="15" fill="#56616b" text-anchor="start">才计入可服务容量</text><text x="30" y="430" font-size="18" fill="#a14929" text-anchor="start">准备链不能即时吸收突发；等待队列必须有长度与时限边界。</text></g></svg>
