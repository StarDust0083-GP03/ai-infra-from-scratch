<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="两个工作点，共用同一条性能天花板"><title>两个工作点，共用同一条性能天花板</title><rect width="960" height="460" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">两个工作点，共用同一条性能天花板</text><path d="M100 340 L890 340" stroke="#202b32" stroke-width="2" fill="none"/><polygon points="890.0,340.0 880.8,343.9 880.8,336.1" fill="#202b32"/><path d="M100 340 L100 80" stroke="#202b32" stroke-width="2" fill="none"/><polygon points="100.0,80.0 103.9,89.2 96.1,89.2" fill="#202b32"/><path d="M100 340 L490 150" stroke="#245d79" stroke-width="2" fill="none"/><path d="M490 150 L880 150" stroke="#245d79" stroke-width="2" fill="none"/><text x="740" y="130" font-size="19" fill="#245d79" text-anchor="start">64 TFLOP/s</text><text x="300" y="90" font-size="18" fill="#56616b" text-anchor="start">带宽 0.8 TB/s</text><text x="520" y="380" font-size="18" fill="#202b32" text-anchor="start">算术强度 FLOP/byte</text><text x="35" y="75" font-size="17" fill="#202b32" text-anchor="start">性能</text><circle cx="198" cy="292" r="7" fill="#a14929"/><text x="210" y="280" font-size="18" fill="#a14929" text-anchor="start">20 → 上限 16</text><circle cx="710" cy="150" r="7" fill="#a14929"/><text x="722" y="138" font-size="18" fill="#a14929" text-anchor="start">160 → 上限 64</text><path d="M490 150 L490 340" stroke="#bfc8cc" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="475" y="365" font-size="16" fill="#202b32" text-anchor="start">80</text><text x="115" y="420" font-size="17" fill="#56616b" text-anchor="start">假设设备；上界取 min(计算峰值, 带宽 × 强度)，并非实测曲线。</text></g></svg>
