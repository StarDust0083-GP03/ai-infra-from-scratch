<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-label="常驻变少，不代表执行峰值等比例缩小"><title>常驻变少，不代表执行峰值等比例缩小</title><rect width="960" height="465" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">常驻变少，不代表执行峰值等比例缩小</text><text x="30" y="90" font-size="20" fill="#202b32" text-anchor="start">长期状态：按 rank 分片驻留</text><text x="42" y="130" font-size="18" fill="#245d79" text-anchor="start">rank 0</text><rect x="30" y="145" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="44" y="174" font-size="19" fill="#202b32" text-anchor="start">参数片段</text><rect x="30" y="202" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="44" y="231" font-size="19" fill="#202b32" text-anchor="start">梯度片段</text><rect x="30" y="259" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="44" y="288" font-size="19" fill="#202b32" text-anchor="start">更新历史</text><text x="162" y="130" font-size="18" fill="#245d79" text-anchor="start">rank 1</text><rect x="150" y="145" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="164" y="174" font-size="19" fill="#202b32" text-anchor="start">参数片段</text><rect x="150" y="202" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="164" y="231" font-size="19" fill="#202b32" text-anchor="start">梯度片段</text><rect x="150" y="259" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="164" y="288" font-size="19" fill="#202b32" text-anchor="start">更新历史</text><text x="282" y="130" font-size="18" fill="#245d79" text-anchor="start">rank 2</text><rect x="270" y="145" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="284" y="174" font-size="19" fill="#202b32" text-anchor="start">参数片段</text><rect x="270" y="202" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="284" y="231" font-size="19" fill="#202b32" text-anchor="start">梯度片段</text><rect x="270" y="259" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="284" y="288" font-size="19" fill="#202b32" text-anchor="start">更新历史</text><text x="402" y="130" font-size="18" fill="#245d79" text-anchor="start">rank 3</text><rect x="390" y="145" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="404" y="174" font-size="19" fill="#202b32" text-anchor="start">参数片段</text><rect x="390" y="202" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="404" y="231" font-size="19" fill="#202b32" text-anchor="start">梯度片段</text><rect x="390" y="259" width="105" height="45" fill="#e7eef0" stroke="#bfc8cc"/><text x="404" y="288" font-size="19" fill="#202b32" text-anchor="start">更新历史</text><path d="M525 85 L525 380" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="555" y="90" font-size="20" fill="#202b32" text-anchor="start">一次 unit 的生命周期</text><rect x="580" y="112" width="320" height="59" fill="#e7eef0" stroke="#bfc8cc"/><text x="594" y="141" font-size="19" fill="#202b32" text-anchor="start">收集参数</text><text x="594" y="167" font-size="15" fill="#56616b" text-anchor="start">AllGather</text><path d="M740 171 L740 181" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="740.0,181.0 736.1,171.8 743.9,171.8" fill="#245d79"/><rect x="580" y="181" width="320" height="59" fill="#e7eef0" stroke="#bfc8cc"/><text x="594" y="210" font-size="19" fill="#202b32" text-anchor="start">执行计算</text><text x="594" y="236" font-size="15" fill="#56616b" text-anchor="start">当前 unit</text><path d="M740 240 L740 250" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="740.0,250.0 736.1,240.8 743.9,240.8" fill="#245d79"/><rect x="580" y="250" width="320" height="59" fill="#e7eef0" stroke="#bfc8cc"/><text x="594" y="279" font-size="19" fill="#202b32" text-anchor="start">归约梯度</text><text x="594" y="305" font-size="15" fill="#56616b" text-anchor="start">ReduceScatter</text><path d="M740 309 L740 319" stroke="#245d79" stroke-width="2" fill="none"/><polygon points=