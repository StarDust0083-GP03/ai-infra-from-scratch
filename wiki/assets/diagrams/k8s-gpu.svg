注册和健康</text><rect x="350" y="255" width="260" height="76" fill="#eee8dd" stroke="#bfc8cc"/><text x="364" y="284" font-size="19" fill="#202b32" text-anchor="start">Pod Pending</text><text x="364" y="310" font-size="15" fill="#56616b" text-anchor="start">查数量与约束</text><rect x="660" y="255" width="260" height="76" fill="#eee8dd" stroke="#bfc8cc"/><text x="674" y="284" font-size="19" fill="#202b32" text-anchor="start">容器内不可见</text><text x="674" y="310" font-size="15" fill="#56616b" text-anchor="start">查分配与运行时</text><text x="40" y="395" font-size="20" fill="#a14929" text-anchor="start">整数量可分配 ≠ 显存足够 ≠ 多 rank 已就绪。</text></g></svg>
