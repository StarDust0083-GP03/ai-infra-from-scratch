<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="按轮重组，而非整批等待"><title>按轮重组，而非整批等待</title><rect width="960" height="420" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">按轮重组，而非整批等待</text><text x="160" y="90" font-size="18" fill="#202b32" text-anchor="start">第 1 轮       第 2 轮       第 3 轮       第 4 轮       第 5 轮</text><text x="60" y="142" font-size="22" fill="#202b32" text-anchor="start">A</text><rect x="155" y="115" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="210" y="141" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="290" y="115" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="345" y="141" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="425" y="115" width="110" height="37" fill="#f2f1eb" stroke="#bfc8cc"/><rect x="560" y="115" width="110" height="37" fill="#f2f1eb" stroke="#bfc8cc"/><rect x="695" y="115" width="110" height="37" fill="#f2f1eb" stroke="#bfc8cc"/><text x="60" y="195" font-size="22" fill="#202b32" text-anchor="start">B</text><rect x="155" y="168" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="210" y="194" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="290" y="168" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="345" y="194" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="425" y="168" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="480" y="194" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="560" y="168" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="615" y="194" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="695" y="168" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="750" y="194" font-size="17" fill="white" text-anchor="middle">执行</text><text x="60" y="248" font-size="22" fill="#202b32" text-anchor="start">C</text><rect x="155" y="221" width="110" height="37" fill="#f2f1eb" stroke="#bfc8cc"/><rect x="290" y="221" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="345" y="247" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="425" y="221" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="480" y="247" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="560" y="221" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="615" y="247" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="695" y="221" width="110" height="37" fill="#f2f1eb" stroke="#bfc8cc"/><text x="60" y="301" font-size="22" fill="#202b32" text-anchor="start">D</text><rect x="155" y="274" width="110" height="37" fill="#f2f1eb" stroke="#bfc8cc"/><rect x="290" y="274" width="110" height="37" fill="#f2f1eb" stroke="#bfc8cc"/><rect x="425" y="274" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="480" y="300" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="560" y="274" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="615" y="300" font-size="17" fill="white" text-anchor="middle">执行</text><rect x="695" y="274" width="110" height="37" fill="#245d79" stroke="#bfc8cc"/><text x="750" y="300" font-size="17" fill="white" text-anchor="middle">执行</text><text x="60" y="375" font-size="18" fill="#202b32" text-anchor="start">A 退出后，D 可在下一轮进入；B 不必结束，批次成员就能改变。</text></g></svg>
