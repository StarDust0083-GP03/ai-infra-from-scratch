<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="先数位置，再换算存储"><title>先数位置，再换算存储</title><rect width="960" height="390" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">先数位置，再换算存储</text><text x="30" y="90" font-size="23" fill="#245d79" text-anchor="start">3 份序列 × 512 个位置 × 2048 个数</text><rect x="80" y="138" width="340" height="120" fill="#f2f4f0" stroke="#245d79"/><rect x="98" y="156" width="340" height="120" fill="#f2f4f0" stroke="#245d79"/><rect x="116" y="174" width="340" height="120" fill="#f2f4f0" stroke="#245d79"/><text x="180" y="265" font-size="20" fill="#202b32" text-anchor="start">[3, 512, 2048]</text><path d="M470 210 L560 210" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="560.0,210.0 550.8,213.9 550.8,206.1" fill="#245d79"/><text x="590" y="160" font-size="23" fill="#202b32" text-anchor="start">3,145,728 个元素</text><text x="590" y="215" font-size="20" fill="#245d79" text-anchor="start">BF16：× 2 bytes = 6 MiB</text><text x="590" y="260" font-size="20" fill="#a14929" text-anchor="start">FP32：× 4 bytes = 12 MiB</text><text x="35" y="350" font-size="19" fill="#202b32" text-anchor="start">形状决定数量；类型决定每元素空间。这里只计算一份 tensor。</text></g></svg>
