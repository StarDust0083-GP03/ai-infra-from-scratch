<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-label="分类后恢复，不把所有失败都交给重启"><title>分类后恢复，不把所有失败都交给重启</title><rect width="960" height="465" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">分类后恢复，不把所有失败都交给重启</text><rect x="350" y="85" width="260" height="65" fill="#e7eef0" stroke="#bfc8cc"/><text x="364" y="114" font-size="19" fill="#202b32" text-anchor="start">检测异常</text><text x="364" y="140" font-size="15" fill="#56616b" text-anchor="start">保留首错与阶段</text><path d="M480 150 L120 225" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="120.0,225.0 128.2,219.3 129.8,226.9" fill="#245d79"/><rect x="30" y="225" width="180" height="90" fill="#e7eef0" stroke="#bfc8cc"/><text x="44" y="254" font-size="19" fill="#202b32" text-anchor="start">请求边界</text><text x="44" y="280" font-size="15" fill="#56616b" text-anchor="start">拒绝 / 明确结束</text><path d="M480 150 L360 225" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="360.0,225.0 365.7,216.8 369.9,223.4" fill="#245d79"/><rect x="270" y="225" width="180" height="90" fill="#e7eef0" stroke="#bfc8cc"/><text x="284" y="254" font-size="19" fill="#202b32" text-anchor="start">协作组失败</text><text x="284" y="280" font-size="15" fill="#56616b" text-anchor="start">重建一致参与者</text><path d="M480 150 L600 225" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="600.0,225.0 590.1,223.4 594.3,216.8" fill="#245d79"/><rect x="510" y="225" width="180" height="90" fill="#e7eef0" stroke="#bfc8cc"/><text x="524" y="254" font-size="19" fill="#202b32" text-anchor="start">设备异常</text><text x="524" y="280" font-size="15" fill="#56616b" text-anchor="start">隔离、诊断、验证</text><path d="M480 150 L840 225" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="840.0,225.0 830.2,226.9 831.8,219.3" fill="#245d79"/><rect x="750" y="225" width="180" height="90" fill="#e7eef0" stroke="#bfc8cc"/><text x="764" y="254" font-size="19" fill="#202b32" text-anchor="start">保存不完整</text><text x="764" y="280" font-size="15" fill="#56616b" text-anchor="start">回退已提交版本</text><text x="40" y="390" font-size="19" fill="#202b32" text-anchor="start">恢复完成条件：可继续正确执行、资源已清理、状态可再次保存。</text><text x="40" y="425" font-size="18" fill="#a14929" text-anchor="start">Pod 重建只恢复组件存在，不自动重放业务结果。</text></g></svg>
