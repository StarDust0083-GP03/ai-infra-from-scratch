<svg viewBox="0 0 900 380" role="img" aria-label="Prefill 批量处理提示词，Decode 逐步生成 token">
<text x="40" y="38" class="eyebrow">TWO PHASES OF INFERENCE</text>
<text x="40" y="94" class="label">Prefill</text><g class="tokens prompt"><rect x="150" y="68" width="62" height="44" rx="3"/><rect x="218" y="68" width="62" height="44" rx="3"/><rect x="286" y="68" width="62" height="44" rx="3"/><rect x="354" y="68" width="62" height="44" rx="3"/><rect x="422" y="68" width="62" height="44" rx="3"/><rect x="490" y="68" width="62" height="44" rx="3"/></g><text x="620" y="95" class="small">一次处理多个 prompt token</text>
<text x="40" y="185" class="label">Decode</text><g class="tokens output"><rect x="150" y="159" width="62" height="44" rx="3"/><rect x="250" y="159" width="62" height="44" rx="3"/><rect x="350" y="159" width="62" height="44" rx="3"/><rect x="450" y="159" width="62" height="44" rx="3"/></g><g class="flow"><path d="M212 181H243"/><path d="M312 181H343"/><path d="M412 181H443"/></g><text x="620" y="185" class="small">每一步通常生成一个 token</text>
<g class="box soft"><rect x="40" y="260" width="390" height="74" rx="4"/><rect x="470" y="260" width="390" height="74" rx="4"/></g><text x="65" y="291" class="label">Prefill：更容易吃满算力</text><text x="65" y="315" class="small">影响 TTFT</text><text x="495" y="291" class="label">Decode：反复读权重与 KV</text><text x="495" y="315" class="small">影响 TPOT / ITL</text>
</svg>