<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="一条档案问答：执行与准备分开观察"><title>一条档案问答：执行与准备分开观察</title><rect width="960" height="440" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">一条档案问答：执行与准备分开观察</text><text x="30" y="130" font-size="18" fill="#56616b" text-anchor="start">接入</text><path d="M115 165 L925 165" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="30" y="240" font-size="18" fill="#56616b" text-anchor="start">引擎</text><path d="M115 275 L925 275" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="30" y="360" font-size="18" fill="#56616b" text-anchor="start">准备</text><path d="M115 395 L925 395" stroke="#bfc8cc" stroke-width="2" fill="none"/><rect x="140" y="85" width="210" height="68" fill="#e7eef0" stroke="#bfc8cc"/><text x="154" y="114" font-size="19" fill="#202b32" text-anchor="start">身份与限额</text><text x="154" y="140" font-size="15" fill="#56616b" text-anchor="start">请求 ID / 模型权限</text><path d="M350 118 L405 118" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="405.0,118.0 395.8,121.9 395.8,114.1" fill="#245d79"/><rect x="410" y="85" width="210" height="68" fill="#e7eef0" stroke="#bfc8cc"/><text x="424" y="114" font-size="19" fill="#202b32" text-anchor="start">模板与分词</text><text x="424" y="140" font-size="15" fill="#56616b" text-anchor="start">形成实际 token 序列</text><path d="M515 153 L515 205" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="515.0,205.0 511.1,195.8 518.9,195.8" fill="#245d79"/><rect x="140" y="205" width="210" height="68" fill="#e7eef0" stroke="#bfc8cc"/><text x="154" y="234" font-size="19" fill="#202b32" text-anchor="start">等待资源</text><text x="154" y="260" font-size="15" fill="#56616b" text-anchor="start">预算、序列数、KV 块</text><path d="M515 190 L245 205" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="245.0,205.0 254.0,200.6 254.4,208.4" fill="#245d79"/><path d="M350 238 L405 238" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="405.0,238.0 395.8,241.9 395.8,234.1" fill="#245d79"/><rect x="410" y="205" width="210" height="68" fill="#e7eef0" stroke="#bfc8cc"/><text x="424" y="234" font-size="19" fill="#202b32" text-anchor="start">GPU 组执行</text><text x="424" y="260" font-size="15" fill="#56616b" text-anchor="start">多 rank 协作</text><path d="M620 238 L675 238" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="675.0,238.0 665.8,241.9 665.8,234.1" fill="#245d79"/><rect x="680" y="205" width="240" height="68" fill="#e7eef0" stroke="#bfc8cc"/><text x="694" y="234" font-size="19" fill="#202b32" text-anchor="start">解码与回传</text><text x="694" y="260" font-size="15" fill="#56616b" text-anchor="start">设备时间 ≠ 收到时间</text><rect x="140" y="325" width="240" height="68" fill="#e7eef0" stroke="#bfc8cc"/><text x="154" y="354" font-size="19" fill="#202b32" text-anchor="start">节点 / 设备 / 模型</text><text x="154" y="380" font-size="15" fill="#56616b" text-anchor="start">控制面先准备容量</text><path d="M380 350 L510 280" stroke="#245d79" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="550" y="366" font-size="16" fill="#56616b" text-anchor="start">虚线：准备依赖，不是每 token 请求</text></g></svg>
