<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="同一设备，不同工作有不同内存组成"><title>同一设备，不同工作有不同内存组成</title><rect width="960" height="410" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">同一设备，不同工作有不同内存组成</text><text x="30" y="154" font-size="22" fill="#202b32" text-anchor="start">推理</text><rect x="135" y="120" width="230" height="64" fill="#e7eef0" stroke="#bfc8cc"/><text x="147" y="158" font-size="19" fill="#202b32" text-anchor="start">权重</text><rect x="365" y="120" width="220" height="64" fill="#e8e5db" stroke="#bfc8cc"/><text x="377" y="158" font-size="19" fill="#202b32" text-anchor="start">KV</text><rect x="585" y="120" width="150" height="64" fill="#e7eef0" stroke="#bfc8cc"/><text x="597" y="158" font-size="19" fill="#202b32" text-anchor="start">工作区</text><rect x="735" y="120" width="140" height="64" fill="#e8e5db" stroke="#bfc8cc"/><text x="747" y="158" font-size="19" fill="#202b32" text-anchor="start">运行时</text><text x="30" y="294" font-size="22" fill="#202b32" text-anchor="start">训练</text><rect x="135" y="260" width="120" height="64" fill="#e7eef0" stroke="#bfc8cc"/><text x="147" y="298" font-size="19" fill="#202b32" text-anchor="start">参数</text><rect x="255" y="260" width="120" height="64" fill="#e8e5db" stroke="#bfc8cc"/><text x="267" y="298" font-size="19" fill="#202b32" text-anchor="start">梯度</text><rect x="375" y="260" width="300" height="64" fill="#e7eef0" stroke="#bfc8cc"/><text x="387" y="298" font-size="19" fill="#202b32" text-anchor="start">优化器</text><rect x="675" y="260" width="200" height="64" fill="#e8e5db" stroke="#bfc8cc"/><text x="687" y="298" font-size="19" fill="#202b32" text-anchor="start">激活 / 临时</text><text x="135" y="220" font-size="18" fill="#245d79" text-anchor="start">请求长度与并发增加 KV；当前执行形状改变工作区。</text><text x="135" y="360" font-size="17" fill="#56616b" text-anchor="start">示意分类，不按比例；训练的长期状态不能靠减少请求并发消除。</text></g></svg>
