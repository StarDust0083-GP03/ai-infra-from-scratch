<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-label="不同切分，改变不同的数据归属"><title>不同切分，改变不同的数据归属</title><rect width="960" height="435" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">不同切分，改变不同的数据归属</text><text x="30" y="93" font-size="18" fill="#245d79" text-anchor="start">切分</text><text x="150" y="93" font-size="18" fill="#245d79" text-anchor="start">分给谁</text><text x="420" y="93" font-size="18" fill="#245d79" text-anchor="start">逻辑关系</text><text x="690" y="93" font-size="18" fill="#245d79" text-anchor="start">主要交接</text><path d="M30 154 L930 154" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="30" y="135" font-size="18" fill="#202b32" text-anchor="start">DP</text><text x="150" y="135" font-size="18" fill="#202b32" text-anchor="start">不同请求 / 样本</text><text x="420" y="135" font-size="18" fill="#202b32" text-anchor="start">模型副本</text><text x="690" y="135" font-size="18" fill="#202b32" text-anchor="start">训练梯度同步</text><path d="M30 209 L930 209" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="30" y="190" font-size="18" fill="#202b32" text-anchor="start">TP</text><text x="150" y="190" font-size="18" fill="#202b32" text-anchor="start">一层内矩阵片段</text><text x="420" y="190" font-size="18" fill="#202b32" text-anchor="start">同一请求协作</text><text x="690" y="190" font-size="18" fill="#202b32" text-anchor="start">层内结果交换</text><path d="M30 264 L930 264" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="30" y="245" font-size="18" fill="#202b32" text-anchor="start">PP</text><text x="150" y="245" font-size="18" fill="#202b32" text-anchor="start">不同层区间</text><text x="420" y="245" font-size="18" fill="#202b32" text-anchor="start">激活依次前进</text><text x="690" y="245" font-size="18" fill="#202b32" text-anchor="start">stage 边界传输</text><path d="M30 319 L930 319" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="30" y="300" font-size="18" fill="#202b32" text-anchor="start">CP</text><text x="150" y="300" font-size="18" fill="#202b32" text-anchor="start">不同序列位置</text><text x="420" y="300" font-size="18" fill="#202b32" text-anchor="start">跨位置注意力</text><text x="690" y="300" font-size="18" fill="#202b32" text-anchor="start">注意力信息</text><path d="M30 374 L930 374" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="30" y="355" font-size="18" fill="#202b32" text-anchor="start">EP</text><text x="150" y="355" font-size="18" fill="#202b32" text-anchor="start">不同专家</text><text x="420" y="355" font-size="18" fill="#202b32" text-anchor="start">token 按 router 分发</text><text x="690" y="355" font-size="18" fill="#202b32" text-anchor="start">定向收发 / AllToAll</text></g></svg>
