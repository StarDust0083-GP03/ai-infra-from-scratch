<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-label="连续历史，不要求连续物理块"><title>连续历史，不要求连续物理块</title><rect width="960" height="455" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">连续历史，不要求连续物理块</text><text x="30" y="90" font-size="20" fill="#202b32" text-anchor="start">逻辑块顺序</text><text x="600" y="90" font-size="20" fill="#202b32" text-anchor="start">物理池中的位置</text><rect x="70" y="110" width="170" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="84" y="139" font-size="19" fill="#202b32" text-anchor="start">逻辑块 0</text><path d="M240 134 L595 264" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="595.0,264.0 585.0,264.5 587.7,257.2" fill="#245d79"/><rect x="70" y="175" width="170" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="84" y="204" font-size="19" fill="#202b32" text-anchor="start">逻辑块 1</text><path d="M240 199 L595 134" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="595.0,134.0 586.6,139.5 585.2,131.8" fill="#245d79"/><rect x="70" y="240" width="170" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="84" y="269" font-size="19" fill="#202b32" text-anchor="start">逻辑块 2</text><path d="M240 264 L595 329" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="595.0,329.0 585.2,331.2 586.6,323.5" fill="#245d79"/><rect x="70" y="305" width="170" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="84" y="334" font-size="19" fill="#202b32" text-anchor="start">逻辑块 3</text><path d="M240 329 L595 199" stroke="#245d79" stroke-width="2" fill="none"/><polygon points="595.0,199.0 587.7,205.8 585.0,198.5" fill="#245d79"/><rect x="600" y="110" width="240" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="614" y="139" font-size="19" fill="#202b32" text-anchor="start">物理块 2</text><rect x="600" y="175" width="240" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="614" y="204" font-size="19" fill="#202b32" text-anchor="start">物理块 4</text><rect x="600" y="240" width="240" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="614" y="269" font-size="19" fill="#202b32" text-anchor="start">物理块 7</text><rect x="600" y="305" width="240" height="48" fill="#e7eef0" stroke="#bfc8cc"/><text x="614" y="334" font-size="19" fill="#202b32" text-anchor="start">物理块 9</text><text x="30" y="415" font-size="18" fill="#56616b" text-anchor="start">块表保存映射，物理地址不需要与逻辑顺序相邻。</text></g></svg>
