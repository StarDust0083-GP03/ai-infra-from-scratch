<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-label="一条请求的阶段耗时，不能只看总长"><title>一条请求的阶段耗时，不能只看总长</title><rect width="960" height="475" fill="#faf9f4"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="40" font-size="25" fill="#202b32" text-anchor="start">一条请求的阶段耗时，不能只看总长</text><text x="30" y="130" font-size="18" fill="#202b32" text-anchor="start">接入</text><rect x="190.0" y="105" width="10.8" height="30" fill="#245d79" stroke="#bfc8cc"/><text x="210.8" y="128" font-size="16" fill="#202b32" text-anchor="start">12 ms</text><text x="30" y="179" font-size="18" fill="#202b32" text-anchor="start">等待</text><rect x="200.8" y="154" width="70.2" height="30" fill="#a14929" stroke="#bfc8cc"/><text x="281.0" y="177" font-size="16" fill="#202b32" text-anchor="start">78 ms</text><text x="30" y="228" font-size="18" fill="#202b32" text-anchor="start">输入执行</text><rect x="271.0" y="203" width="58.5" height="30" fill="#245d79" stroke="#bfc8cc"/><text x="339.5" y="226" font-size="16" fill="#202b32" text-anchor="start">65 ms</text><text x="30" y="277" font-size="18" fill="#202b32" text-anchor="start">生成</text><rect x="329.5" y="252" width="432.0" height="30" fill="#a14929" stroke="#bfc8cc"/><text x="771.5" y="275" font-size="16" fill="#202b32" text-anchor="start">480 ms</text><text x="30" y="326" font-size="18" fill="#202b32" text-anchor="start">末段回传</text><rect x="761.5" y="301" width="22.5" height="30" fill="#245d79" stroke="#bfc8cc"/><text x="794.0" y="324" font-size="16" fill="#202b32" text-anchor="start">25 ms</text><path d="M190 365 L800 365" stroke="#bfc8cc" stroke-width="2" fill="none"/><text x="190" y="390" font-size="16" fill="#202b32" text-anchor="start">0</text><text x="784" y="390" font-size="16" fill="#202b32" text-anchor="start">660 ms</text><text x="30" y="435" font-size="17" fill="#56616b" text-anchor="start">首字边界与客户端收到时间需按测量口径定义；末段回传不能算作模型执行。</text></g></svg>
